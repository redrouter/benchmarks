<div class="table-bar"><h2>{{ bar_title }}</h2>
{% if model_picker %}{% set chosen = models[model.id if model else default_model] %}<div class="picker"><button type="button" class="picker-button" aria-haspopup="listbox" aria-expanded="false" aria-label="Model"><img class="model-logo" src="{{ chosen.logo }}" alt="" width="20" height="20"><span>{{ chosen.name }}</span></button><ul class="picker-menu" role="listbox" aria-label="Model" hidden>{% for m in models.values() %}<li role="option" tabindex="-1" data-value="{{ m.id }}" aria-selected="{{ 'true' if m.id == chosen.id else 'false' }}"><img class="model-logo" src="{{ m.logo }}" alt="" width="20" height="20"><span>{{ m.name }}</span></li>{% endfor %}</ul><select id="model-selector" hidden data-navigate="{{ 'true' if model else 'false' }}">{% for m in models.values() %}<option value="{{ m.id }}"{% if m.id == chosen.id %} selected{% endif %}>{{ m.name }}</option>{% endfor %}</select></div>{% endif %}
<div class="picker"><button type="button" class="picker-button" aria-haspopup="listbox" aria-expanded="false" aria-label="Measurement region"><span>{{ regions[0].label }}</span></button><ul class="picker-menu" role="listbox" aria-label="Measurement region" hidden>{% for region in regions %}<li role="option" tabindex="-1" data-value="{{ region.id }}" aria-selected="{{ 'true' if loop.first else 'false' }}"><span>{{ region.label }}</span></li>{% endfor %}</ul><select id="region-selector" hidden>{% for region in regions %}<option value="{{ region.id }}">{{ region.label }}</option>{% endfor %}</select></div>
<a class="icon-button" href="/data/summary.csv" download aria-label="Download CSV" title="Download CSV"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 2.5v7.5m0 0L4.75 6.75M8 10l3.25-3.25M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>
