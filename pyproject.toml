[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "redrouter-benchmarks"
version = "0.1.0"
description = "Continuous, reproducible measurements of inference APIs"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "RedRouter", email = "support@redrouter.org"}]
dependencies = ["httpx>=0.28,<0.29", "jinja2>=3.1,<4", "markdown>=3.7,<4"]

[project.scripts]
redrouter-benchmarks = "redrouter_benchmarks.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "jsonschema[format]>=4.23,<5", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/redrouter_benchmarks"]

[tool.hatch.build.targets.wheel.force-include]
catalog = "redrouter_benchmarks/_catalog"
prompts = "redrouter_benchmarks/_prompts"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
